# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# O simplemente: docker compose up  (si renombras este a docker-compose.override.yml)

services:
  backend:
    command: uvicorn app.main:app --host 127.0.0.1 --port 8000 --reload
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: debug
    volumes:
      - ./backend:/app   # Hot-reload: cambios en código se reflejan al instante

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    # Vite en el 3000, por HTTP y en la red del equipo (como en producción),
    # con proxy a la API en 127.0.0.1:8000
    volumes: !override
      - ./frontend:/app
      - /app/node_modules   # Evitar que el volumen sobreescriba node_modules del contenedor
