# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# O simplemente: docker compose up  (si renombras este a docker-compose.override.yml)

services:
  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: debug
    volumes:
      - ./backend:/app   # Hot-reload: cambios en código se reflejan al instante

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    # !override sustituye el "3000:80" del fichero base en lugar de sumarse a
    # él (Compose concatena las listas de puertos y chocarían en el 3000).
    # (en desarrollo el panel va por HTTP con Vite: sin 443 ni 80)
    ports: !override
      - "3000:3000"
    volumes: !override
      - ./frontend:/app
      - /app/node_modules   # Evitar que el volumen sobreescriba node_modules del contenedor
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
