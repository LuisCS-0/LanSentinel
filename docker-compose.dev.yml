# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# O simplemente: docker compose up  (si renombras este a docker-compose.override.yml)

services:
  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: debug
    volumes:
      - ./backend:/app   # Hot-reload: cambios en código se reflejan al instante

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: npm run dev -- --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules   # Evitar que el volumen sobreescriba node_modules del contenedor
    environment:
      VITE_API_URL: http://localhost:8000
