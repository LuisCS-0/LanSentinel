# Plantilla: la imagen oficial de nginx sustituye ${BACKEND_URL} al arrancar
# (se copia a /etc/nginx/templates/). Las variables propias de nginx como
# $host no se tocan porque no existen como variables de entorno.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Canal de eventos en tiempo real (SSE): conexión larga que no debe pasar
    # por el buffer de nginx ni cortarse por inactividad (el backend manda un
    # latido cada 20 s y cierra él mismo a los 15 minutos).
    location /api/v1/events/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Proxy al backend para evitar CORS en producción.
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # El endpoint de salud está fuera de /api/, también hay que redirigirlo.
    location /health {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback: todas las rutas van al index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
