# Plantilla: la imagen oficial de nginx sustituye ${BACKEND_URL},
# ${PANEL_HTTPS_PORT} y ${PANEL_HTTP_PORT} al arrancar (se copia a
# /etc/nginx/templates/). Las variables propias de nginx como $host no se
# tocan porque no existen como variables de entorno.
#
# El contenedor usa la red del equipo: nginx escucha directamente en sus
# puertos y llega al backend por 127.0.0.1, la única dirección en la que
# escucha la API. Así todo el acceso desde la red pasa por aquí, cifrado.

# Caché del panel. Los ficheros de /assets/ llevan una huella en el nombre
# (cambian de nombre en cada versión): se guardan un año. El resto, con
# index.html a la cabeza, "no-cache": el navegador lo revalida cada vez
# (304 si no ha cambiado) y tras una actualización carga el panel nuevo, en
# lugar de un index.html viejo que apunta a los ficheros de la versión
# anterior. A la API, la documentación y /health no se les añade nada: lo
# decide el backend (add_header no envía la cabecera si el valor es vacío).
map $uri $lansentinel_cache {
    ~^/assets/                                  "public, max-age=31536000, immutable";
    ~^/(api|docs|redoc|openapi\.json|health)    "";
    default                                     "no-cache";
}

# HTTP: solo redirige al panel cifrado (así la contraseña nunca viaja en claro).
# El 3000 es el puerto del panel en versiones anteriores.
server {
    listen ${PANEL_HTTP_PORT};
    listen 3000;
    location / {
        return 301 https://$host:${PANEL_HTTPS_PORT}$request_uri;
    }
}

server {
    listen ${PANEL_HTTPS_PORT} ssl;
    # HTTP/2: todas las peticiones del panel comparten una conexión, así que
    # tener varias pestañas abiertas (cada una con su canal SSE) ya no agota
    # el límite de 6 conexiones por servidor del navegador
    http2 on;

    # Los genera el backend (CA propia de LanSentinel) en /var/lib/lansentinel/tls;
    # 40-lansentinel-tls.sh los copia aquí y recarga nginx si cambian
    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:1m;
    ssl_session_timeout 1d;
    # Sin HSTS a propósito: con un certificado que el navegador aún no conoce,
    # HSTS impediría aceptar el aviso y el panel quedaría inaccesible

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    # Aquí y no en cada location: un add_header dentro de una location haría
    # que esa location dejara de heredar los de arriba
    add_header Cache-Control $lansentinel_cache always;

    # Canal de eventos en tiempo real (SSE): conexión larga que no debe pasar
    # por el buffer de nginx ni cortarse por inactividad (el backend manda un
    # latido cada 20 s y cierra él mismo a los 15 minutos).
    location /api/v1/events/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Proxy al backend para evitar CORS en producción. X-Forwarded-Proto le
    # dice que la petición llegó cifrada (cookie de sesión con Secure).
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Un escaneo de puertos completo (nmap -sV) puede pasar del minuto
        # que nginx espera por defecto
        proxy_read_timeout 300s;
    }

    # Documentación interactiva de la API (Swagger, con su /docs/oauth2-redirect,
    # y ReDoc) y su esquema. Con una expresión regular: una location "/docs/"
    # haría que nginx redirigiera /docs a /docs/.
    location ~ ^/(docs|redoc|openapi\.json)(/.*)?$ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # El endpoint de salud está fuera de /api/, también hay que redirigirlo.
    location /health {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback: todas las rutas van al index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
