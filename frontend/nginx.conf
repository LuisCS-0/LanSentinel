server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy al backend para evitar CORS en producción.
    location /api/ {
        proxy_pass http://192.168.56.10:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # El endpoint de salud está fuera de /api/, también hay que redirigirlo.
    location /health {
        proxy_pass http://192.168.56.10:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback: todas las rutas van al index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
