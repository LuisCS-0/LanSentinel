# Reglas de Emerging Threats que no se cargan (formato de suricata-update).
# En una red doméstica generan muchas alertas sin amenaza detrás: avisan de
# que algo existe (consultas a ciertos dominios, versiones de programas...)
# o son reglas de "caza" pensadas para analistas, no de detección.
# Se aplican en la siguiente actualización de las reglas (diaria).
group:emerging-info.rules
group:emerging-hunting.rules

# Protocolos industriales (Modbus, DNP3): sus analizadores no están activados
# en suricata.yaml (no hay ese tipo de equipos en una casa) y sus reglas no se
# podrían cargar
group:modbus-events.rules
group:dnp3-events.rules
