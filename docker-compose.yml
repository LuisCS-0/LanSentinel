services:

  # ─── Base de datos ────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: lansentinel_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lansentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lansentinel_pass}
      POSTGRES_DB: ${POSTGRES_DB:-lansentinel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    # Solo en loopback: el backend (network_mode: host) llega por localhost y
    # la base de datos no queda expuesta al resto de la red local
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - lansentinel_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lansentinel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend (FastAPI) ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lansentinel_backend
    restart: unless-stopped
    network_mode: host
    # Todas las variables de .env llegan al backend (FIREWALL_NEVER_BLOCK,
    # avisos por Telegram/ntfy/correo, TIMEZONE...). Las de "environment"
    # tienen prioridad. required: false → no falla si aún no hay .env.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lansentinel}:${POSTGRES_PASSWORD:-lansentinel_pass}@localhost:5432/${POSTGRES_DB:-lansentinel}
      # Vacía → el backend genera una clave y la guarda en /var/lib/lansentinel
      SECRET_KEY: ${SECRET_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # Contraseña del primer administrador. Vacía → se genera una aleatoria en
      # /var/lib/lansentinel/initial_admin_password
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Interfaz de red a monitorizar (ej: eth0, enp0s3)
      MONITOR_INTERFACE: ${MONITOR_INTERFACE:-eth0}
      SURICATA_OFFSET_PATH: /var/lib/lansentinel/suricata.offset
    # El código va dentro de la imagen; docker-compose.dev.yml monta ./backend
    # para el hot-reload. No se monta el socket de Docker: daría al backend
    # control total sobre el host y no se usa.
    volumes:
      # Logs de Suricata (producción)
      - /var/log/suricata:/var/log/suricata:ro
      # Estado persistente: offset de Suricata, clave de sesión, contraseña inicial
      - /var/lib/lansentinel:/var/lib/lansentinel
    depends_on:
      db:
        condition: service_healthy
    # Necesario para captura de paquetes (modo desarrollo en host)
    # En producción, el backend corre directamente en el gateway
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Frontend (React + Nginx) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lansentinel_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      # El backend usa network_mode: host, así que desde la red de Docker se
      # alcanza a través del host. Si no funciona en tu instalación, pon la
      # IP del equipo en .env (p. ej. BACKEND_URL=http://192.168.56.10:8000).
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - lansentinel_net
    depends_on:
      - backend

  # ─── Suricata (IDS/IPS) ───────────────────────────────────────────
  suricata:
    # Versión fijada: con "latest" una actualización de Suricata podía cambiar
    # el formato de reglas o de eve.json sin avisar
    image: jasonish/suricata:8.0
    container_name: lansentinel_suricata
    restart: unless-stopped
    network_mode: host          # Necesita acceso directo a la red
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    volumes:
      - ./docker/suricata/suricata.yaml:/etc/suricata/suricata.yaml
      - ./docker/suricata/rules:/etc/suricata/rules
      - /var/log/suricata:/var/log/suricata
    command: -i ${MONITOR_INTERFACE:-eth0} --init-errors-fatal
    profiles:
      - production   # Solo se levanta en producción con: --profile production

  # ─── DHCP y DNS de la LAN (modo router) ───────────────────────────
  dhcp-dns:
    build:
      context: ./docker/dnsmasq
    container_name: lansentinel_dnsmasq
    restart: unless-stopped
    network_mode: host          # sirve DHCP y DNS en la interfaz de la LAN
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
    environment:
      MONITOR_INTERFACE: ${MONITOR_INTERFACE:-eth0}
      DHCP_RANGE_START: ${DHCP_RANGE_START:-}
      DHCP_RANGE_END: ${DHCP_RANGE_END:-}
      DHCP_LEASE_TIME: ${DHCP_LEASE_TIME:-12h}
      DNS_UPSTREAM: ${DNS_UPSTREAM:-1.1.1.1,9.9.9.9}
      LOCAL_DOMAIN: ${LOCAL_DOMAIN:-lan}
    volumes:
      # Concesiones DHCP: el backend podrá leer de aquí el nombre de cada equipo
      - /var/lib/lansentinel:/var/lib/lansentinel
    profiles:
      - router     # Solo en modo router: --profile router (lo usa scripts/instalar.sh)

volumes:
  postgres_data:

networks:
  lansentinel_net:
    driver: bridge
