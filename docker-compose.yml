services:

  # ─── Base de datos ────────────────────────────────────────────────
  db:
    # Si cambia la versión, cambiar también postgresql-client-16 en backend/Dockerfile
    image: postgres:16-alpine
    container_name: lansentinel_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lansentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lansentinel_pass}
      POSTGRES_DB: ${POSTGRES_DB:-lansentinel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    # Solo en loopback: el backend (network_mode: host) llega por localhost y
    # la base de datos no queda expuesta al resto de la red local
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - lansentinel_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lansentinel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend (FastAPI) ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lansentinel_backend
    restart: unless-stopped
    network_mode: host
    # Todas las variables de .env llegan al backend (FIREWALL_NEVER_BLOCK,
    # avisos por Telegram/ntfy/correo, TIMEZONE...). Las de "environment"
    # tienen prioridad. required: false → no falla si aún no hay .env.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lansentinel}:${POSTGRES_PASSWORD:-lansentinel_pass}@localhost:5432/${POSTGRES_DB:-lansentinel}
      # Vacía → el backend genera una clave y la guarda en /var/lib/lansentinel
      SECRET_KEY: ${SECRET_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # Contraseña del primer administrador. Vacía → se genera una aleatoria en
      # /var/lib/lansentinel/initial_admin_password
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Interfaz de red a monitorizar (ej: eth0, enp0s3)
      MONITOR_INTERFACE: ${MONITOR_INTERFACE:-eth0}
      SURICATA_OFFSET_PATH: /var/lib/lansentinel/suricata.offset
    # El código va dentro de la imagen; docker-compose.dev.yml monta ./backend
    # para el hot-reload. No se monta el socket de Docker: daría al backend
    # control total sobre el host y no se usa.
    volumes:
      # Logs de Suricata (producción)
      - /var/log/suricata:/var/log/suricata:ro
      # Estado persistente: offset de Suricata, clave de sesión, contraseña inicial
      - /var/lib/lansentinel:/var/lib/lansentinel
      # Copias de seguridad: por defecto junto al estado; con BACKUP_PATH en
      # .env, en otra carpeta del equipo (mejor otro disco, p. ej. un USB)
      - ${BACKUP_PATH:-/var/lib/lansentinel/backups}:/var/lib/lansentinel/backups
      # Carpeta del proyecto, solo para incluir el .env en las copias
      - .:/run/lansentinel/proyecto:ro
      # Estado de las reglas de Suricata, para mostrarlo en el panel
      - suricata_data:/var/lib/suricata:ro
    depends_on:
      db:
        condition: service_healthy
    # Necesario para captura de paquetes (modo desarrollo en host)
    # En producción, el backend corre directamente en el gateway
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Frontend (React + Nginx) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lansentinel_frontend
    restart: unless-stopped
    # Red del equipo, como el backend: nginx llega a la API por 127.0.0.1
    # (el backend no escucha en ninguna otra dirección) y escucha él mismo
    # en los puertos del panel: HTTPS en el 443, y en el 80 y el 3000 (el de
    # versiones anteriores) solo redirige. Si están ocupados en el equipo,
    # cámbialos en .env con PANEL_HTTPS_PORT y PANEL_HTTP_PORT.
    network_mode: host
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://127.0.0.1:8000}
      PANEL_HTTPS_PORT: ${PANEL_HTTPS_PORT:-443}
      PANEL_HTTP_PORT: ${PANEL_HTTP_PORT:-80}
    # Certificado del panel: lo genera el backend (solo lectura aquí)
    volumes:
      - /var/lib/lansentinel/tls:/run/lansentinel-tls:ro
    depends_on:
      - backend

  # ─── Suricata (IDS/IPS) ───────────────────────────────────────────
  suricata:
    # Versión fijada: con "latest" una actualización de Suricata podía cambiar
    # el formato de reglas o de eve.json sin avisar
    image: jasonish/suricata:8.0
    container_name: lansentinel_suricata
    restart: unless-stopped
    network_mode: host          # Necesita acceso directo a la red
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    # Reglas de Emerging Threats: se descargan al arrancar si no las hay y se
    # actualizan cada RULES_UPDATE_HOURS horas; los registros se rotan al
    # pasar de LOG_MAX_MB megas (docker/suricata/arranque.sh)
    entrypoint: ["/usr/local/bin/arranque.sh"]
    environment:
      RULES_UPDATE_HOURS: ${RULES_UPDATE_HOURS:-24}
      LOG_MAX_MB: ${SURICATA_LOG_MAX_MB:-100}
    volumes:
      - ./docker/suricata/suricata.yaml:/etc/suricata/suricata.yaml
      - ./docker/suricata/rules:/etc/suricata/rules
      - ./docker/suricata/disable.conf:/etc/lansentinel/disable.conf:ro
      - ./docker/suricata/arranque.sh:/usr/local/bin/arranque.sh:ro
      - ./docker/suricata/actualizar-reglas.sh:/usr/local/bin/actualizar-reglas.sh:ro
      - suricata_data:/var/lib/suricata
      - /var/log/suricata:/var/log/suricata
    # Sin --init-errors-fatal: con decenas de miles de reglas, una que no
    # cargue (p. ej. de una versión más nueva) no debe dejar la red sin IDS
    command: -i ${MONITOR_INTERFACE:-eth0}
    profiles:
      - production   # Solo se levanta en producción con: --profile production

volumes:
  postgres_data:
  # Reglas de Emerging Threats y estado de su actualización (el backend lo lee)
  suricata_data:

networks:
  lansentinel_net:
    driver: bridge
